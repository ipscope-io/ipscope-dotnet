name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (.NET 8.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build SDK & Tests
        run: dotnet build tests/IpScope.Sdk.Tests/IpScope.Sdk.Tests.csproj --configuration Release

      - name: Run Verification Suite
        run: dotnet run --project tests/IpScope.Sdk.Tests/IpScope.Sdk.Tests.csproj --configuration Release --no-build
